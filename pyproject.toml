[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makepartsnow"
dynamic = ["version"]
description = "Instant 3D printing quotes for CAD files from the command line (Make Parts Now)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Make Parts Now", email = "orders@makepartsnow.com" }]
keywords = ["3d printing", "cad", "step", "stl", "quote", "manufacturing", "sls", "fdm", "cadquery", "build123d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://makepartsnow.com/developers"
Source = "https://github.com/makepartsnow/makepartsnow-cli"
Issues = "https://github.com/makepartsnow/makepartsnow-cli/issues"
Privacy = "https://makepartsnow.com/legal/privacy"

[project.scripts]
mpn = "makepartsnow.cli:main"

[tool.setuptools.dynamic]
version = { attr = "makepartsnow.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"makepartsnow.core" = ["CORE_PIN.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
